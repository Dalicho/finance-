<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Finanzas</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #6b7385;
    --border: #e3e7f0; --primary: #3b5bdb; --ingreso: #2b9348; --gasto: #d62839;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141c; --card: #1b2030; --text: #e8ebf2; --muted: #9aa3b8;
      --border: #2a3145; --primary: #6c8cff; --ingreso: #52c47a; --gasto: #ff5c6c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.6rem; margin: 0 0 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 16px;
  }
  .resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .resumen .card { margin: 0; text-align: center; }
  .resumen small { color: var(--muted); display: block; margin-bottom: 4px; }
  .resumen strong { font-size: 1.3rem; }
  .verde { color: var(--ingreso); } .rojo { color: var(--gasto); }
  form, .filtros { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  label { font-size: .85rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  input, select, button {
    font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); width: 100%;
  }
  .full { grid-column: 1 / -1; }
  button { cursor: pointer; border: none; background: var(--primary); color: #fff; font-weight: 600; }
  button.sec { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 500; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .acciones button { width: auto; flex: 1; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }
  .info { min-width: 0; }
  .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info small { color: var(--muted); }
  .monto { font-weight: 700; white-space: nowrap; }
  .borrar { background: transparent; color: var(--muted); width: auto; padding: 6px 8px; font-size: 1.1rem; }
  .vacio { color: var(--muted); text-align: center; padding: 20px 0; }
  @media (max-width: 560px) {
    .resumen { grid-template-columns: 1fr; }
    form, .filtros { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 Mis Finanzas</h1>

  <div class="resumen" style="margin-bottom:16px">
    <div class="card"><small>Ingresos</small><strong class="verde" id="tIngresos">$0.00</strong></div>
    <div class="card"><small>Gastos</small><strong class="rojo" id="tGastos">$0.00</strong></div>
    <div class="card"><small>Saldo</small><strong id="tSaldo">$0.00</strong></div>
  </div>

  <div class="card">
    <h2>Nuevo movimiento</h2>
    <form id="form">
      <label>Tipo
        <select id="tipo">
          <option value="gasto">Gasto</option>
          <option value="ingreso">Ingreso</option>
        </select>
      </label>
      <label>Monto ($)
        <input type="number" id="monto" step="0.01" min="0.01" required placeholder="0.00">
      </label>
      <label>Categoría
        <select id="categoria"></select>
      </label>
      <label>Fecha
        <input type="date" id="fecha" required>
      </label>
      <label class="full">Descripción
        <input type="text" id="descripcion" placeholder="Ej: almuerzo, sueldo, bus...">
      </label>
      <button type="submit" class="full">Agregar</button>
    </form>
  </div>

  <div class="card">
    <h2>Filtros</h2>
    <div class="filtros">
      <label>Mes
        <input type="month" id="fMes">
      </label>
      <label>Categoría
        <select id="fCategoria"></select>
      </label>
    </div>
    <div class="acciones">
      <button class="sec" id="limpiar">Quitar filtros</button>
    </div>
  </div>

  <div class="card">
    <h2>Movimientos</h2>
    <ul id="lista"></ul>
  </div>

  <div class="card">
    <h2>Respaldo</h2>
    <small style="color:var(--muted)">Los datos se guardan en este navegador. Exporta para pasarlos a otro dispositivo.</small>
    <div class="acciones">
      <button class="sec" id="exportar">Exportar</button>
      <button class="sec" id="importarBtn">Importar</button>
      <input type="file" id="importar" accept=".json" hidden>
    </div>
  </div>
</div>

<script>
  const CATEGORIAS = {
    gasto: ["Comida", "Transporte", "Vivienda", "Servicios", "Salud", "Educación", "Entretenimiento", "Ropa", "Otros"],
    ingreso: ["Sueldo", "Freelance", "Negocio", "Regalo", "Otros"]
  };
  const CLAVE = "misFinanzas";
  let movimientos = cargar();

  const $ = id => document.getElementById(id);
  const fmt = n => "$" + n.toLocaleString("es-EC", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function cargar() {
    try { return JSON.parse(localStorage.getItem(CLAVE)) || []; } catch { return []; }
  }
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify(movimientos)); } catch {}
  }

  function llenarCategorias() {
    $("categoria").innerHTML = CATEGORIAS[$("tipo").value].map(c => `<option>${c}</option>`).join("");
  }
  function llenarFiltroCategorias() {
    const todas = [...new Set([...CATEGORIAS.gasto, ...CATEGORIAS.ingreso])];
    $("fCategoria").innerHTML = `<option value="">Todas</option>` + todas.map(c => `<option>${c}</option>`).join("");
  }

  function filtrados() {
    const mes = $("fMes").value, cat = $("fCategoria").value;
    return movimientos.filter(m =>
      (!mes || m.fecha.startsWith(mes)) && (!cat || m.categoria === cat)
    ).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.id - a.id);
  }

  function escapar(t) {
    const d = document.createElement("div"); d.textContent = t; return d.innerHTML;
  }

  function render() {
    const lista = filtrados();
    const ing = lista.filter(m => m.tipo === "ingreso").reduce((s, m) => s + m.monto, 0);
    const gas = lista.filter(m => m.tipo === "gasto").reduce((s, m) => s + m.monto, 0);
    const saldo = ing - gas;
    $("tIngresos").textContent = fmt(ing);
    $("tGastos").textContent = fmt(gas);
    $("tSaldo").textContent = fmt(saldo);
    $("tSaldo").className = saldo >= 0 ? "verde" : "rojo";

    $("lista").innerHTML = lista.length ? lista.map(m => `
      <li>
        <div class="info">
          <b>${escapar(m.descripcion || m.categoria)}</b>
          <small>${m.categoria} · ${m.fecha.split("-").reverse().join("/")}</small>
        </div>
        <span class="monto ${m.tipo === "ingreso" ? "verde" : "rojo"}">
          ${m.tipo === "ingreso" ? "+" : "−"}${fmt(m.monto)}
        </span>
        <button class="borrar" data-id="${m.id}" title="Eliminar">✕</button>
      </li>`).join("") : `<div class="vacio">No hay movimientos</div>`;
  }

  $("tipo").addEventListener("change", llenarCategorias);

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const monto = parseFloat($("monto").value);
    if (!monto || monto <= 0) return;
    movimientos.push({
      id: Date.now(),
      tipo: $("tipo").value,
      monto,
      categoria: $("categoria").value,
      fecha: $("fecha").value,
      descripcion: $("descripcion").value.trim()
    });
    guardar(); render();
    $("monto").value = ""; $("descripcion").value = "";
  });

  $("lista").addEventListener("click", e => {
    const id = e.target.dataset.id;
    if (!id || !confirm("¿Eliminar este movimiento?")) return;
    movimientos = movimientos.filter(m => m.id != id);
    guardar(); render();
  });

  $("fMes").addEventListener("change", render);
  $("fCategoria").addEventListener("change", render);
  $("limpiar").addEventListener("click", () => {
    $("fMes").value = ""; $("fCategoria").value = ""; render();
  });

  $("exportar").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(movimientos, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "mis-finanzas.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $("importarBtn").addEventListener("click", () => $("importar").click());
  $("importar").addEventListener("change", e => {
    const archivo = e.target.files[0];
    if (!archivo) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const datos = JSON.parse(r.result);
        if (!Array.isArray(datos)) throw 0;
        if (confirm(`¿Reemplazar tus datos con ${datos.length} movimientos del archivo?`)) {
          movimientos = datos; guardar(); render();
        }
      } catch { alert("El archivo no es válido."); }
      e.target.value = "";
    };
    r.readAsText(archivo);
  });

  const hoy = new Date();
  $("fecha").value = new Date(hoy - hoy.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  llenarCategorias();
  llenarFiltroCategorias();
  render();
</script>
</body>
</html>
